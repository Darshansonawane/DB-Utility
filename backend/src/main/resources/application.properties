spring.application.name=qa-database-utility
# Local only: never listen on a network interface
server.address=127.0.0.1
server.port=8080

# Application metadata store (embedded H2 file DB in MySQL mode). Separate from the banking QA/UAT database.
qa-utility.data-dir=${user.home}/.qa-database-utility
spring.datasource.url=jdbc:h2:file:${qa-utility.data-dir}/metadata;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:metadata-schema.sql

# Safety configuration
qa-utility.allowed-environments=QA,UAT
qa-utility.blocked-host-patterns=prod,prd,production,live
qa-utility.cors-origins=http://localhost:5173,http://127.0.0.1:5173
# Optional: QA_UTILITY_MASTER_KEY env var overrides the generated key file used to encrypt stored DB passwords
qa-utility.master-key=${QA_UTILITY_MASTER_KEY:}

spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
logging.level.com.qa.utility=INFO
